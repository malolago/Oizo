[project]
name = "oizo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dishka>=1.10.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oizo"]

[dependency-groups]
dev = [
    "watchfiles>=1.2.0",
]
